
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents: RixArchives</title>

<style>
:root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border-color: #30363d;
    --text-main: #c9d1d9;
    --text-heading: #f0f6fc;
    --text-muted: #8b949e;
    --accent-blue: #58a6ff;
    --accent-red: #f85149;
    --accent-yellow: #d29922;
    --code-bg: rgba(110, 118, 129, 0.15);
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: var(--bg-primary);
    color: var(--text-main);
    font-family: var(--font-stack);
    font-size: 16px;
    line-height: 1.6;
    display: flex;
    min-height: 100vh;
}

.app-container {
    display: flex;
    width: 100%;
}

.sidebar-left {
    width: 280px;
    background-color: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    flex-shrink: 0;
}

.main-content {
    flex: 1;
    max-width: 860px;
    padding: 40px 48px;
    margin: 0 auto;
}

.sidebar-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 16px;
}

.repo-list {
    list-style: none;
}

.repo-list li {
    margin-bottom: 10px;
}

.repo-item {
    display: block;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    padding: 8px 10px;
    color: var(--text-main);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.15s ease, border-color 0.15s ease;
}

.repo-item:hover {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
}

h1, h2, h3 {
    color: var(--text-heading);
    font-weight: 600;
    line-height: 1.25;
}

h1 {
    font-size: 2rem;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 24px;
}

h2 {
    font-size: 1.4rem;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-color);
    margin-top: 36px;
    margin-bottom: 16px;
}

p {
    margin-bottom: 16px;
}

.muted {
    color: var(--text-muted);
}

hr {
    height: 0.25em;
    margin: 32px 0;
    background-color: var(--border-color);
    border: 0;
}

@media (max-width: 768px) {
    .sidebar-left {
        display: none;
    }

    .main-content {
        padding: 20px 16px;
    }
}
</style>
</head>

<body>

<div class="app-container">
    <main class="main-content">

            Documents I have filled.

                </li>
                <li>
                    <a class="repo-item" href="robin.html">

                    </a>
                </li>
                <li>
                    <a class="repo-item" href="gta6.html">
                        GTA VI Review
                    </a>
                </li>
                <li>
                    <a class="repo-item" href="503.html">
                        ???
                    </a>
                </li>
            </ul>
        </section>

        <hr>

        <p class="muted">
            Rix (@ajsea1sy)
        </p>

    </main>

</div>

</body>
</html>
