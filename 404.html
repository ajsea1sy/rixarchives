
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Code 404: RixArchives</title>

<style>
:root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --border-color: #30363d;
    --text-main: #c9d1d9;
    --text-heading: #f0f6fc;
    --text-muted: #8b949e;
    --accent-blue: #58a6ff;
    --accent-yellow: #d29922;
    --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg-primary);
    color: var(--text-main);
    font-family: var(--font-stack);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    line-height: 1.6;
}

.container {
    width: 90%;
    max-width: 600px;
    padding: 40px 20px;
}

h1 {
    color: var(--text-heading);
    font-size: 6rem;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 16px;
}

hr {
    height: 1px;
    background: var(--border-color);
    border: 0;
    margin: 20px 0;
}

.notice {
    padding: 12px 16px;
    color: var(--text-muted);
    border-left: 0.25em solid var(--accent-yellow);
    background: var(--bg-secondary);
    margin-bottom: 28px;
    font-size: 14px;
    text-align: left;
}

.notice strong {
    color: var(--text-main);
}

a {
    display: inline-block;
    padding: 10px 20px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    text-decoration: none;
    transition: 0.15s ease;
}

a:hover {
    background: var(--bg-tertiary);
    border-color: var(--accent-blue);
    color: var(--accent-blue);
}
</style>
</head>
<body>

<main class="container">

    <h1>404</h1>

    <hr>

    <div class="notice">
        <strong></strong>
        This link no longer exists, or has never existed.
    </div>

    <a href="/">> Return</a>

</main>

</body>
</html>
